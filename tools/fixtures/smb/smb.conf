[global]
    workgroup = WORKGROUP
    server role = standalone server
    server min protocol = SMB2_10
    server signing = mandatory
    map to guest = Never
    disable netbios = yes
    smb ports = 445
    load printers = no
    disable spoolss = yes
    log file = /tmp/samba.log
[transfer]
    path = /srv/transfer
    valid users = zenithtest
    guest ok = no
    read only = no
