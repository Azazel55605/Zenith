name: CI

on:
  push:
    branches: [main]
    tags: ["v*", "kernel/v*"]
  pull_request:
  workflow_dispatch:

env:
  COSMOS_VERSION: 3.0.89
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  unit-tests:
    name: Unit tests (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends e2fsprogs clang binutils openssl
      - run: dotnet test tests/Zenith.Tests --logger "console;verbosity=normal"
      - run: python3 -B tools/test_run_network.py
      - run: python3 -B tools/test_dhcp_capture.py
      - run: python3 -B tools/build-tls.py /tmp/zenith-tls-native
      - run: python3 -B tools/build-tls.py /tmp/zenith-tls --host
      - run: python3 -B tools/test_tls_bridge.py /tmp/zenith-tls/libzenith-tls.so
      - run: python3 -B tools/test_signed_package_tool.py /tmp/zenith-tls/libzenith-tls.so
      - run: python3 -B tools/test_smoke_test.py
      - name: Release controller regressions
        run: python3 -B deploy/distributor/validate.py --controller-only
      - run: python3 -B tools/test_package_tool.py
      - run: python3 -B tools/test_meta_package_tool.py
      - run: python3 -B tools/test_publish_package.py
      - run: python3 -B tools/test_distributor_release.py
      - run: python3 -B tools/test_distributor_poll.py
      - run: python3 -B tools/test_distributor_maintenance.py
      - run: python3 -B tools/test_distributor_dashboard.py
      - run: python3 -B tools/test_dashboard_setup.py

  build:
    name: Build ISO + smoke test
    needs: [unit-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Cosmos toolchain
        run: |
          dotnet tool install -g Cosmos.Tools --version "$COSMOS_VERSION"
          dotnet tool install -g Cosmos.Patcher --version "$COSMOS_VERSION"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          "$HOME/.dotnet/tools/cosmos" install -y --tools

      - name: Install native TLS build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang binutils

      - name: Build kernel ISO
        run: dotnet publish -c Release -r linux-x64 -o output-x64 --verbosity minimal

      - name: Pinned runtime, TCP and boot dependency adapters
        run: python3 -B -m unittest tools/test_tcp_connect_fixup.py tools/test_quiet_fixup.py tools/test_idt_fixup.py tools/test_scheduler_wake_fixup.py tools/test_conservative_roots_fixup.py

      - uses: actions/upload-artifact@v4
        with:
          name: zenith-iso
          path: |
            output-x64/Zenith.iso
            output-x64/Zenith.elf

      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-x86 e2fsprogs dosfstools ovmf mtools parted openssl

      - name: Enable KVM
        run: |
          # GitHub's Linux runners expose /dev/kvm; make it usable without root. If it is not
          # there, QEMU falls back to TCG (slower, the timeouts below allow for it).
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || echo "no KVM, using TCG"

      - name: Smoke test in QEMU
        # The Cosmos tool bundle puts its own QEMU wrappers first on PATH; use the distro's.
        env:
          QEMU: /usr/bin/qemu-system-x86_64
        run: python3 tools/smoke-test.py --timeout 600 --step-timeout 180 --keep smoke

      - name: Boot installed ext2 disk with UEFI (no ISO)
        env:
          QEMU: /usr/bin/qemu-system-x86_64
        run: python3 tools/test-installed-boot.py smoke/installed-disk.img --test-session-override --keep smoke-efi

      - name: Accounts and access regression
        env:
          QEMU: /usr/bin/qemu-system-x86_64
        run: python3 tools/security-smoke.py smoke-security

      - name: Settings, sessions and offline package dry-runs
        env:
          QEMU: /usr/bin/qemu-system-x86_64
        run: python3 tools/foundation-smoke.py smoke-foundation

      - name: Ext2 large workload (512 MiB pressure regression)
        env:
          QEMU: /usr/bin/qemu-system-x86_64
        run: python3 tools/smoke-test.py --timeout 600 --step-timeout 180 --memory 512 --large-ext2-stress --keep smoke-large

      - name: Guided GUI and headless installation
        timeout-minutes: 30
        run: |
          python3 -B tools/guided-install-smoke.py gui smoke-guided-gui
          python3 -B tools/guided-install-smoke.py headless smoke-guided-headless
      - name: Self-contained install and RAM rescue
        timeout-minutes: 15
        run: python3 -B tools/install-smoke.py smoke-install
      - name: Serial headless (no GPU, live and installed UEFI)
        env:
          QEMU: /usr/bin/qemu-system-x86_64
        run: python3 tools/headless-smoke.py smoke-headless

      - name: Signed offline package install and recovery
        env:
          QEMU: /usr/bin/qemu-system-x86_64
        run: python3 -B tools/package-smoke.py smoke-packages

      - name: Distributor release acceptance (login, repository, native, recovery)
        timeout-minutes: 90
        env:
          QEMU: /usr/bin/qemu-system-x86_64
        run: python3 -B deploy/distributor/validate.py --existing --keep smoke-release

      - name: IDT import adaptation and repeated installed UEFI startup
        timeout-minutes: 10
        env:
          QEMU: /usr/bin/qemu-system-x86_64
        run: |
          python3 -B tools/test_idt_fixup.py
          python3 -B tools/test_quiet_fixup.py
          python3 -B tools/test_scheduler_wake_fixup.py
          python3 -B tools/test_conservative_roots_fixup.py
          python3 -B tools/idt-boot-smoke.py smoke-idt

      - name: Experimental native CPU workers (1/2/4 CPUs)
        timeout-minutes: 10
        env:
          QEMU: /usr/bin/qemu-system-x86_64
        run: python3 -B tools/native-cpu-smoke.py smoke-cpu

      - name: Protected native executable packages
        timeout-minutes: 20
        env:
          QEMU: /usr/bin/qemu-system-x86_64
        run: python3 -B deploy/distributor/validation-runner.py tools/native-process-smoke.py smoke-native --cpu-workers

      - name: VMware-profile DHCP receive lab (Ethernet unicast and broadcast)
        env:
          QEMU: /usr/bin/qemu-system-x86_64
        run: python3 -B tools/dhcp-receive-smoke.py smoke-dhcp-receive

      - name: Local transfer integrity and throughput benchmark
        env:
          QEMU: /usr/bin/qemu-system-x86_64
        run: python3 -B tools/transfer-bench.py smoke-transfer --disk-mib 16

      - name: German keyboard and history (PS2 and virtio)
        env:
          QEMU: /usr/bin/qemu-system-x86_64
        run: python3 -B tools/keyboard-smoke.py smoke-keyboard

      - name: IPv4 network lab (HTTP/HTTPS, certificates, DNS, NTP)
        env:
          QEMU: /usr/bin/qemu-system-x86_64
        run: python3 -B tools/network-smoke.py smoke-network

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-logs
          path: |
            smoke-dhcp-receive/
            smoke-keyboard/
            smoke-release/
            smoke-transfer/
            smoke/
            smoke-large/
            smoke-efi/
            smoke-security/
            smoke-foundation/
            smoke-idt/
            smoke-cpu/
            smoke-headless/
            smoke-install/
            smoke-guided-gui/
            smoke-guided-headless/
            smoke-network/
            smoke-packages/
            smoke-kernel/
            smoke-native/
            !smoke-release/**/keys/**
            !smoke-native/keys/**
            !smoke-kernel/keys/**
            !smoke-packages/keys/**

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [unit-tests, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: zenith-iso
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Zenith.iso Zenith.elf \
            --repo "$GITHUB_REPOSITORY" --title "Zenith $GITHUB_REF_NAME" --generate-notes
