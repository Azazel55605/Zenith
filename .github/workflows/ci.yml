name: CI

on:
  push:
    branches: [main]
    tags: ["v*", "kernel/v*"]
  pull_request:
  workflow_dispatch:

# Superseded branch runs can stop; tag qualification is never cancelled by a
# later push. No successful guest result is cached between candidates.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  COSMOS_VERSION: 3.0.89
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  QEMU: /usr/bin/qemu-system-x86_64

jobs:
  unit-tests:
    name: Unit tests (host)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/environment
      - run: dotnet test tests/Zenith.Tests --logger "console;verbosity=normal"
      - run: python3 -B tools/test_run_network.py
      - run: python3 -B tools/test_dhcp_capture.py
      - run: python3 -B tools/build-tls.py /tmp/zenith-tls-native
      - run: python3 -B tools/build-tls.py /tmp/zenith-tls --host
      - run: python3 -B tools/test_tls_bridge.py /tmp/zenith-tls/libzenith-tls.so
      - run: python3 -B tools/test_signed_package_tool.py /tmp/zenith-tls/libzenith-tls.so
      - run: python3 -B tools/test_smoke_test.py
      - name: Release controller regressions
        run: python3 -B deploy/distributor/validate.py --controller-only
      - run: python3 -B tools/test_package_tool.py
      - run: python3 -B tools/test_meta_package_tool.py
      - run: python3 -B tools/test_publish_package.py
      - run: python3 -B tools/test_distributor_maintenance.py
      - run: python3 -B tools/test_distributor_dashboard.py
      - run: python3 -B tools/test_dashboard_setup.py

  build:
    name: Build ISO
    needs: [unit-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      native: ${{ steps.matrix.outputs.native }}
      legacy: ${{ steps.matrix.outputs.legacy }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/environment
        with:
          cosmos: 'true'
      - name: Build kernel ISO once
        run: dotnet publish -c Release -r linux-x64 -o output-x64 --verbosity minimal
      - name: Pinned runtime, TCP and boot dependency adapters
        run: python3 -B -m unittest tools/test_tcp_connect_fixup.py tools/test_quiet_fixup.py tools/test_idt_fixup.py tools/test_scheduler_wake_fixup.py tools/test_monitor_timeout_fixup.py tools/test_conservative_roots_fixup.py tools/test_allocation_publication_fixup.py tools/test_mouse_poll_fixup.py
      - name: Bind artifacts and gate matrices to this commit
        id: matrix
        run: |
          python3 -B tools/ci-validation.py seal-build
          echo "native=$(python3 -B tools/ci-validation.py matrix native)" >> "$GITHUB_OUTPUT"
          echo "legacy=$(python3 -B tools/ci-validation.py matrix legacy)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: zenith-iso
          overwrite: true
          compression-level: 1
          if-no-files-found: error
          path: |
            output-x64/Zenith.iso
            output-x64/Zenith.elf
            output-x64/ci-build.json

  native:
    name: Native / ${{ matrix.name }}
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.build.outputs.native) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/environment
        with:
          guest: 'true'
      - uses: actions/download-artifact@v4
        with:
          name: zenith-iso
          path: output-x64
      - name: Fresh native gate on the shared kernel
        env:
          ZENITH_NATIVE_JOBS: '1'
          ZENITH_VALIDATION_FRESH: '1'
        run: python3 -B tools/ci-validation.py native '${{ matrix.gate }}' obj/ci/native
      - uses: actions/upload-artifact@v4
        with:
          name: ci-result-native-${{ matrix.gate }}
          overwrite: true
          if-no-files-found: error
          path: obj/ci/native/result.json
      - uses: ./.github/actions/guest-evidence
        if: always()
        with:
          name: native-${{ matrix.gate }}

  legacy:
    name: System / ${{ matrix.gate }}
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.build.outputs.legacy) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/environment
        with:
          guest: 'true'
      - uses: actions/download-artifact@v4
        with:
          name: zenith-iso
          path: output-x64
      - name: Independent guest regression
        run: python3 -B tools/ci-validation.py legacy '${{ matrix.gate }}' obj/ci/legacy
      - uses: actions/upload-artifact@v4
        with:
          name: ci-result-legacy-${{ matrix.gate }}
          overwrite: true
          if-no-files-found: error
          path: obj/ci/legacy/result.json
      - uses: ./.github/actions/guest-evidence
        if: always()
        with:
          name: legacy-${{ matrix.gate }}

  qualification:
    # Preserve the previous required-check name, but only after every matrix
    # member passes and its source/artifact receipt has been checked.
    name: Build ISO + smoke test
    needs: [unit-tests, build, native, legacy]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Refuse failed, cancelled or skipped prerequisites
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          jobs = json.loads(os.environ['RESULTS'])
          assert all(job['result'] == 'success' for job in jobs.values()), jobs
          PY
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: zenith-iso
          path: output-x64
      - uses: actions/download-artifact@v4
        with:
          pattern: ci-result-*
          path: obj/ci/results
      - name: Verify complete fresh coverage and identical artifacts
        run: python3 -B tools/ci-validation.py aggregate obj/ci/results

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [qualification]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: zenith-iso
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Zenith.iso Zenith.elf \
            --repo "$GITHUB_REPOSITORY" --title "Zenith $GITHUB_REF_NAME" --generate-notes
