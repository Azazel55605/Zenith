# Dedicated distributor VM, /etc/nginx/sites-available/zenith-packages.
# Disable Debian's default site before enabling this default_server.
# LAN/VPN bootstrap transport; signatures remain mandatory.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /srv/zenith/packages;
    autoindex off;
    disable_symlinks on;
    default_type application/octet-stream;
    add_header X-Content-Type-Options nosniff always;

    # Optional dashboard snippet is installed separately with authentication.
    include /etc/nginx/snippets/zenith-dashboard*.conf;

    location ~ /\. { deny all; }
    location / {
        limit_except GET { deny all; }
        try_files $uri =404;
    }
}
